services:
  agentic-rag:
    build:
      context: .
      args:
        # "[multilingual]" adds sentence-transformers (large, pulls in torch)
        EXTRAS: ""
    ports:
      - "8000:8000"
    environment:
      # reach an Ollama server running on the host machine
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # uncomment before exposing the port beyond localhost:
      # API_AUTH_TOKEN: change-me
    # To use your own provider keys, uncomment this. Settings in .env win over
    # the defaults, so if it sets EMBEDDINGS_PROVIDER=multilingual, also set
    # EXTRAS above and run `rag reindex` inside the container once.
    # env_file:
    #   - .env
    volumes:
      # the index, graph, and uploads survive rebuilds and restarts. The
      # image runs as uid 10001; a volume made by an image older than 3.14.0
      # is owned by root, so fix it once after upgrading:
      #   docker compose run --rm -u root agentic-rag chown -R 10001:10001 /app/storage
      - rag-storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway" # host networking on Linux
    restart: unless-stopped

volumes:
  rag-storage:
