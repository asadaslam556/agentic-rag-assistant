name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code; nothing here needs write access to the repository
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # actions are pinned to commits, not tags, so a moved tag cannot change
      # what runs; Dependabot updates the hash and the version comment together
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Dependency vulnerabilities
        # once per run is enough; both matrix entries resolve the same ranges
        if: matrix.python-version == '3.12'
        run: |
          pip install pip-audit==2.10.1
          pip-audit --skip-editable
      - name: Lint
        run: ruff check src tests scripts
      - name: Text checks
        run: python scripts/check_text.py
      - name: Tests
        run: pytest -q
      - name: Offline eval (mock provider, no secrets needed)
        env:
          LLM_PROVIDER: mock
        run: |
          rag ingest data/sample_docs
          rag eval

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build the console
        working-directory: frontend
        run: npm run build
